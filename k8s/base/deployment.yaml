apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-demo
  namespace: self-healing-demo
  labels:
    app.kubernetes.io/name: self-healing-demo
    app.kubernetes.io/part-of: azure-self-healing-sre-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: self-healing-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-healing-demo
        app.kubernetes.io/part-of: azure-self-healing-sre-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/arnolddennis/azure-self-healing-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
