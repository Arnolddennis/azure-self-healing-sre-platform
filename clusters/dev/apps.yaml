apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: self-healing-platform
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Arnolddennis/azure-self-healing-sre-platform
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: self-healing-platform
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: self-healing-platform
  path: ./k8s/base
